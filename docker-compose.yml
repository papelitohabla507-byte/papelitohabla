services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: papelitohabla
      POSTGRES_USER: papelitohabla
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cambiar_en_local}
    volumes:
      - pgdata:/var/lib/postgresql/data
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db
volumes:
  pgdata:
